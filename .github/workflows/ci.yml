name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (same command Railway runs)
        run: npm run build

  # Follow-up: a full test job needs a Postgres+pgvector service, `npm run migrate`,
  # and R2 credentials (as GitHub Actions secrets) for the upload lifecycle test.
  # Tracked separately; typecheck+build already catches the build/type failures
  # that break the Railway deploy.
